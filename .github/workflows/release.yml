name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - name: Tag must match package.json version
        run: node -e "const v = 'v' + require('./package.json').version; if (v !== process.env.GITHUB_REF_NAME) { console.error('tag ' + process.env.GITHUB_REF_NAME + ' does not match ' + v); process.exit(1); }"
      - run: npm test
      - name: Publish unless this version is already on npm
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          printf 'registry=https://registry.npmjs.org/\n' > "$npmrc"
          unset NODE_AUTH_TOKEN
          npm --version
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "GitHub did not provide an OIDC token request URL"
            exit 1
          fi
          node <<'NODE'
          const fs = require('fs');
          const https = require('https');
          const { URL } = require('url');
          function get(url, headers) {
            return new Promise((resolve, reject) => {
              const req = https.request(url, { method: 'GET', headers }, res => {
                let body = '';
                res.on('data', c => { body += c; });
                res.on('end', () => resolve({ status: res.statusCode, body }));
              });
              req.on('error', reject);
              req.end();
            });
          }
          function post(url, headers, payload) {
            return new Promise((resolve, reject) => {
              const data = payload || '';
              const req = https.request(url, { method: 'POST', headers: { ...headers, 'Content-Length': Buffer.byteLength(data) } }, res => {
                let body = '';
                res.on('data', c => { body += c; });
                res.on('end', () => resolve({ status: res.statusCode, body }));
              });
              req.on('error', reject);
              req.end(data);
            });
          }
          (async () => {
            const url = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
            url.searchParams.set('audience', 'npm:registry.npmjs.org');
            const id = await get(url, {
              Accept: 'application/json',
              Authorization: 'Bearer ' + process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN,
            });
            console.log('github id token status', id.status);
            const value = JSON.parse(id.body).value;
            if (!value) {
              console.log('github id token body', id.body.slice(0, 400));
              process.exit(1);
            }
            const payload = JSON.parse(Buffer.from(value.split('.')[1], 'base64url').toString());
            const keys = ['repository', 'repository_owner', 'workflow', 'workflow_ref', 'job_workflow_ref', 'ref', 'environment', 'repository_visibility', 'event_name', 'aud'];
            console.log(JSON.stringify(Object.fromEntries(keys.map(k => [k, payload[k]])), null, 2));
            const exchanged = await post('https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/boppi', {
              Accept: 'application/json',
              'Content-Type': 'application/json',
              Authorization: 'Bearer ' + value,
            }, '');
            let message = exchanged.body.slice(0, 500);
            try {
              const parsed = JSON.parse(exchanged.body);
              message = parsed.message || parsed.error || (parsed.token ? 'token received' : message);
            } catch (_) {}
            console.log('npm oidc exchange', exchanged.status, message);
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
          version=$(node -p "require('./package.json').version")
          if npm view "boppi@$version" version >/dev/null 2>&1; then
            echo "boppi@$version is already published; skipping publish"
          else
            npm publish --provenance --access public --loglevel verbose
          fi
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
