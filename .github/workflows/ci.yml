name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        node: [18, 20, 22]
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run smoke
      # npm test pins macOS config rules (run-all.js); the probe runs the CLI with this runner's own rules.
      - name: Platform probe (host rules, no darwin override)
        run: node test/platform/platform-probe.js
      - name: Check packed file list
        run: |
          npm pack --dry-run --json > pack-report.json
          node -e "
            const files = require('./pack-report.json')[0].files.map(f => f.path);
            const require_ = p => { if (!files.includes(p)) { throw new Error('tarball is missing ' + p); } };
            require_('bin/boppi.js');
            require_('src/engine/models.js');
            if (files.some(p => p.startsWith('test/'))) throw new Error('test/ leaked into the tarball');
            console.log('tarball OK: ' + files.length + ' files');
          "

  # Experimental until a real Windows device passes the AG-19 checklist:
  # failures do not block the build. autocrlf is off so the checkout matches
  # .gitattributes (LF), as a developer's clone with the default
  # core.autocrlf=true also does through eol=lf.
  windows:
    strategy:
      fail-fast: false
      matrix:
        node: [18, 22]
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run smoke
      - name: Platform probe (Windows rules)
        run: node test/platform/platform-probe.js
